name: Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: # manual trigger

permissions:
  contents: write
  id-token: write

jobs:
  build_test_pack:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      tag: ${{ steps.csproj_ver.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Test
      run: dotnet test -c Release --no-build --verbosity normal

    - name: Get csproj version
      id: csproj_ver
      uses: KageKirin/get-csproj-version@v1.0.0
      with:
        file: src/OrderCloud.SDK/OrderCloud.SDK.csproj

    - name: Get latest release tag
      id: release_ver
      uses: InsonusK/get-latest-release@v1.0.1
      with:
        myToken: ${{ github.token }}
        exclude_types: prerelease
        view_top: 1

    - name: Output versions
      run: |
        echo "csproj version: ${{ steps.csproj_ver.outputs.version }}"
        echo "latest release: ${{ steps.release_ver.outputs.tag_name }}"

    # A release created with GITHUB_TOKEN does not start other workflows
    # (https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow).
    # Call publish.yml via workflow_call instead of relying on the release event.
    - name: Decide whether to publish
      id: decide
      env:
        CSPROJ_VER: ${{ steps.csproj_ver.outputs.version }}
        RELEASE_VER: ${{ steps.release_ver.outputs.tag_name }}
      run: |
        if [ "$CSPROJ_VER" != "$RELEASE_VER" ]; then
          echo "publish=true" >> "$GITHUB_OUTPUT"
        else
          echo "publish=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build release notes
      id: notes
      if: steps.decide.outputs.publish == 'true'
      env:
        CSPROJ_VER: ${{ steps.csproj_ver.outputs.version }}
        RELEASE_VER: ${{ steps.release_ver.outputs.tag_name }}
      run: |
        {
          echo "body<<EOF"
          echo "- Updates for latest OrderCloud API version"
          if [ -n "$RELEASE_VER" ] && git rev-parse "$RELEASE_VER" >/dev/null 2>&1; then
            echo
            echo "### Commits since $RELEASE_VER"
            git log --oneline "${RELEASE_VER}..HEAD" --no-merges | head -20 || true
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create and publish release
      if: steps.decide.outputs.publish == 'true'
      env:
        CSPROJ_VER: ${{ steps.csproj_ver.outputs.version }}
      uses: ncipollo/release-action@v1.10.0
      with:
        tag: ${{ env.CSPROJ_VER }}
        name: ${{ env.CSPROJ_VER }}
        body: ${{ steps.notes.outputs.body }}
        artifacts: "**/*.nupkg"
        draft: false
        skipIfReleaseExists: true

  # Same pipeline, not a GITHUB_TOKEN-triggered release event. Keeps nuget.org
  # Trusted Publishing policy pointed at publish.yml.
  publish:
    needs: build_test_pack
    if: needs.build_test_pack.outputs.publish == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.build_test_pack.outputs.tag }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read
